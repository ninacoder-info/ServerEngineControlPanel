services:
  core-dev:
    image: ubuntu:24.04
    platform: linux/arm64
    working_dir: /app
    ports:
      - "18000:8000"
    environment:
      SE_DB_PATH: /var/lib/server-engine/control.db
      SE_ADMIN_USER: admin
      SE_ADMIN_PASSWORD: change-me-now
    volumes:
      - ./core:/app
      - core-dev-pip-cache:/root/.cache/pip
      - core-dev-state:/var/lib/server-engine
      - core-dev-services:/opt/server-engine/services
    command: >-
      bash -lc "apt-get update &&
      apt-get install -y --no-install-recommends python3 python3-pip python3-venv openssh-client ca-certificates &&
      python3 -m venv /opt/server-engine-venv &&
      /opt/server-engine-venv/bin/pip install -e . &&
      /opt/server-engine-venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web-dev:
    image: ubuntu:24.04
    platform: linux/arm64
    working_dir: /app
    volumes:
      - ./web:/app
      - web-dev-node-modules:/app/node_modules
      - web-dev-npm-cache:/root/.npm
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:18000
    depends_on:
      - core-dev
    command: >-
      bash -lc "apt-get update &&
      apt-get install -y --no-install-recommends curl ca-certificates gnupg &&
      curl -fsSL https://deb.nodesource.com/setup_22.x | bash - &&
      apt-get install -y --no-install-recommends nodejs &&
      npm install &&
      npm run dev -- --host 0.0.0.0"

volumes:
  core-dev-pip-cache:
  core-dev-state:
  core-dev-services:
  web-dev-node-modules:
  web-dev-npm-cache:
