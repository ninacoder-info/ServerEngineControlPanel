services:
  installer-amd64:
    build:
      context: .
      dockerfile: docker/test-installer.Dockerfile
    platform: linux/amd64
    image: server-engine-installer-amd64
    environment:
      SE_GITHUB_TOKEN:
    volumes:
      - .:/src
    command:
      - bash
      - -lc
      - >-
        set -eu;
        curl -fL https://secp.ninacoder.top/install.sh
        -o /tmp/server-engine-install.sh;
        bash /tmp/server-engine-install.sh --install-system-deps --yes
    profiles:
      - installer

  core-dev:
    platform: linux/amd64

  web-dev:
    platform: linux/amd64
