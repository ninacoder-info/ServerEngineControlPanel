# Development/test environment only. Customer servers use ./install.sh natively.
services:
  core:
    platform: linux/amd64
    build: { context: ./core }
    environment:
      APP_ENV: "${APP_ENV:-development}"
    ports: ["${API_PORT:-8000}:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      start_period: 5s
      interval: 10s
      timeout: 5s
      retries: 3
  web:
    platform: linux/amd64
    build:
      context: ./web
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8000}"
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
